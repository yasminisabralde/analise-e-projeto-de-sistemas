<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FocusENEM - Gerenciador Time Box</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 1.2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .timer-display { font-size: 2.8rem; font-weight: bold; color: #e74c3c; margin: 0.4rem 0; font-family: monospace; }
        .form-group { text-align: left; margin-bottom: 0.6rem; }
        label { font-weight: 600; font-size: 0.85rem; color: #34495e; display: block; }
        input, select, button { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 5px; font-size: 0.85rem; }
        button { background: #27ae60; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 0.4rem; }
        .stop-btn { background: #e74c3c; display: none; }
        ul { list-style: none; padding: 0; max-height: 90px; overflow-y: auto; }
        li { background: #f8f9fa; padding: 0.35rem; border-left: 3px solid #27ae60; margin-bottom: 0.35rem; font-size: 0.8rem; text-align: left; }
    </style>
</head>
<body>
<div class="card">
    <h2>■ FocusENEM - Time Box</h2>
    <div class="form-group">
        <label>Matéria Recorrente do ENEM:</label>
        <select id="materia">
            <optgroup label="Matemática e suas Tecnologias">
                <option value="Razão, Proporção e Porcentagem">Razão, Proporção e Porcentagem</option>
                <option value="Funções (Afim e Quadrática)">Funções (Afim e Quadrática)</option>
                <option value="Geometria Plana e Espacial">Geometria Plana e Espacial</option>
                <option value="Estatística (Média, Moda e Mediana)">Estatística (Média, Moda, Mediana)</option>
            </optgroup>
            <optgroup label="Ciências da Natureza">
                <option value="Ecologia e Sustentabilidade">Ecologia e Sustentabilidade</option>
                <option value="Estequiometria e Soluções">Estequiometria e Soluções</option>
                <option value="Química Orgânica">Química Orgânica</option>
                <option value="Mecânica e Cinemática">Mecânica e Cinemática</option>
                <option value="Eletrodinâmica">Eletrodinâmica</option>
            </optgroup>
            <optgroup label="Ciências Humanas">
                <option value="História: Brasil Colônia e Império">História: Brasil Colônia e Império</option>
                <option value="Geografia Física e Meio Ambiente">Geografia Física e Meio Ambiente</option>
                <option value="Sociologia/Filosofia: Cultura e Cidadania">Sociologia/Filosofia: Cultura e Cidadania</option>
            </optgroup>
            <optgroup label="Linguagens e Códigos">
                <option value="Interpretação de Texto">Interpretação de Texto</option>
                <option value="Funções e Figuras de Linguagem">Funções e Figuras de Linguagem</option>
                <option value="Literatura Modernista">Literatura Modernista</option>
            </optgroup>
            <optgroup label="Redação">
                <option value="Estrutura Dissertativa-Argumentativa">Estrutura Dissertativa-Argumentativa</option>
                <option value="Proposta de Intervenção (5 Elementos)">Proposta de Intervenção (5 Elementos)</option>
            </optgroup>
        </select>
    </div>
    <div class="form-group">
        <label>Duração (minutos):</label>
        <input type="number" id="duracao" value="25" min="1" max="60" oninput="atualizarTempoInicial()" onchange="atualizarTempoInicial()">
    </div>
    <div class="timer-display" id="timer">25:00</div>
    <button id="startBtn" onclick="iniciarTimeBox()">Iniciar Bloco de Foco</button>
    <button id="stopBtn" class="stop-btn" onclick="pararTimeBox()">Interromper Bloco</button>
    <div style="text-align:left; margin-top:0.8rem;">
        <h4 style="margin:0 0 0.2rem 0; font-size:0.85rem;">Blocos Concluídos</h4>
        <ul id="listaHistorico"></ul>
    </div>
</div>

<script>
let tempoRestante = 0, timerInterval = null;

// Garante que o tempo inicial seja calculado corretamente assim que a página abre
document.addEventListener("DOMContentLoaded", () => {
    atualizarTempoInicial();
});

function atualizarDisplay(segundos) {
    const min = String(Math.floor(segundos / 60)).padStart(2, '0');
    const seg = String(segundos % 60).padStart(2, '0');
    document.getElementById('timer').innerText = `${min}:${seg}`;
}

function atualizarTempoInicial() {
    const min = parseInt(document.getElementById('duracao').value);
    if (!isNaN(min) && min > 0) {
        tempoRestante = min * 60; // Sincroniza a variável de controle do cronômetro
        atualizarDisplay(tempoRestante);
    }
}

function iniciarTimeBox() {
    clearInterval(timerInterval); // Evita bugs caso o usuário clique múltiplas vezes no botão iniciar
    
    const min = parseInt(document.getElementById('duracao').value);
    if (isNaN(min) || min <= 0) return alert('Tempo inválido.');
    
    tempoRestante = min * 60; 
    atualizarDisplay(tempoRestante);
    
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';
    
    timerInterval = setInterval(() => {
        tempoRestante--; 
        if (tempoRestante >= 0) {
            atualizarDisplay(tempoRestante);
        }
        
        if (tempoRestante <= 0) {
            clearInterval(timerInterval);
            alert('■ Time Box encerrada! Faça sua pausa obrigatória.');
            registrarBloco(); 
            resetsInterface();
        }
    }, 1000);
}

function pararTimeBox() { 
    clearInterval(timerInterval); 
    alert('Bloco interrompido.'); 
    resetsInterface(); 
}

function resetsInterface() {
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('stopBtn').style.display = 'none';
    atualizarTempoInicial();
}

function registrarBloco() {
    const materia = document.getElementById('materia').value;
    const min = document.getElementById('duracao').value;
    const item = document.createElement('li');
    item.innerText = `■ ${materia} - Bloco de ${min} min concluído.`;
    document.getElementById('listaHistorico').appendChild(item);
}
</script>
</body>
</html>
